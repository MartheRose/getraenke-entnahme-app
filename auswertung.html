<script>

  const SUPABASE_URL =
    "https://sbiykoqewpotxpliyrsg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_88GzkUHIG028vaNlh2S1RQ_DZqJb_Y7";


  let allRows = [];

  let filteredRows = [];


  async function supabaseRequest(endpoint) {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      endpoint,
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        }
      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        "Supabase-Fehler " +
        response.status +
        ": " +
        errorText
      );

    }


    return await response.json();

  }


  async function loadData() {

    try {

      const data = await supabaseRequest(

        "withdrawal_items" +

        "?select=" +

        "id,quantity,created_at," +

        "withdrawals!inner(" +

          "id,employee_id,created_at," +

          "employees(id,name)," +

          "status" +

        ")," +

        "products!inner(" +

          "id,name,volume_liter,unit" +

        ")" +

        "&order=created_at.desc"

      );


      console.log(
        "Geladene Entnahmen:",
        data
      );


      allRows =
        data || [];


      filteredRows =
        [...allRows];


      populateEmployees();

      renderTable();


    } catch (error) {

      console.error(
        "Fehler beim Laden der Entnahmen:",
        error
      );


      showError(

        "Die Entnahmen konnten nicht geladen werden.\n\n" +

        error.message

      );

    }

  }


  function populateEmployees() {

    const select =
      document.getElementById(
        "employeeFilter"
      );


    select.innerHTML = `

      <option value="">
        Alle Mitarbeiter
      </option>

    `;


    const employeeMap =
      new Map();


    allRows.forEach(
      row => {

        const employee =
          row.withdrawals?.employees;


        if (employee) {

          employeeMap.set(
            employee.id,
            employee.name
          );

        }

      }
    );


    employeeMap.forEach(
      (name, id) => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          id;


        option.textContent =
          name;


        select.appendChild(
          option
        );

      }
    );

  }


  function renderTable() {

    const tbody =
      document.getElementById(
        "withdrawalTableBody"
      );


    tbody.innerHTML = "";


    let totalBottles = 0;

    let totalLiters = 0;


    filteredRows.forEach(
      row => {

        const employee =
          row.withdrawals?.employees;


        const product =
          row.products;


        const quantity =
          Number(row.quantity || 0);


        const volume =
          Number(
            product?.volume_liter || 0
          );


        totalBottles +=
          quantity;


        totalLiters +=
          quantity * volume;


        const tr =
          document.createElement(
            "tr"
          );


        tr.innerHTML = `

          <td>
            ${formatDate(
              row.withdrawals?.created_at
            )}
          </td>

          <td>
            ${escapeHtml(
              employee?.name ||
              "Unbekannt"
            )}
          </td>

          <td>
            ${escapeHtml(
              product?.name ||
              "Unbekannt"
            )}
          </td>

          <td class="quantity">
            ${quantity}
          </td>

          <td>
            ${formatLiter(
              quantity * volume
            )}
          </td>

        `;


        tbody.appendChild(
          tr
        );

      }
    );


    const withdrawalIds =
      filteredRows
        .map(
          row =>
            row.withdrawals?.id
        )
        .filter(Boolean);


    document
      .getElementById(
        "totalWithdrawals"
      )
      .textContent =

        new Set(
          withdrawalIds
        ).size;


    document
      .getElementById(
        "totalBottles"
      )
      .textContent =
        totalBottles;


    document
      .getElementById(
        "totalLiters"
      )
      .textContent =

        formatLiter(
          totalLiters
        );


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    if (
      filteredRows.length === 0
    ) {

      document
        .getElementById(
          "empty"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "withdrawalTable"
        )
        .style.display =
          "none";

    } else {

      document
        .getElementById(
          "empty"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "withdrawalTable"
        )
        .style.display =
          "table";

    }

  }


  function applyFilters() {

    const dateFrom =
      document
        .getElementById(
          "dateFrom"
        )
        .value;


    const dateTo =
      document
        .getElementById(
          "dateTo"
        )
        .value;


    const employeeId =
      document
        .getElementById(
          "employeeFilter"
        )
        .value;


    filteredRows =
      allRows.filter(
        row => {

          const date =
            new Date(
              row.withdrawals?.created_at
            );


          const dateString =
            date.toLocaleDateString(
              "sv-SE"
            );


          const matchesFrom =
            !dateFrom ||
            dateString >= dateFrom;


          const matchesTo =
            !dateTo ||
            dateString <= dateTo;


          const matchesEmployee =
            !employeeId ||
            String(
              row.withdrawals?.employee_id
            ) ===
            String(employeeId);


          return (
            matchesFrom &&
            matchesTo &&
            matchesEmployee
          );

        }
      );


    renderTable();

  }


  function resetFilters() {

    document
      .getElementById(
        "dateFrom"
      )
      .value = "";


    document
      .getElementById(
        "dateTo"
      )
      .value = "";


    document
      .getElementById(
        "employeeFilter"
      )
      .value = "";


    filteredRows =
      [...allRows];


    renderTable();

  }


  function exportCSV() {

    if (
      filteredRows.length === 0
    ) {

      alert(
        "Es gibt keine Daten zum Exportieren."
      );

      return;

    }


    const headers = [

      "Datum",

      "Mitarbeiter",

      "Getränk",

      "Menge",

      "Liter"

    ];


    const rows =
      filteredRows.map(
        row => {

          const employee =
            row.withdrawals?.employees;


          const product =
            row.products;


          const quantity =
            Number(
              row.quantity || 0
            );


          const liters =
            quantity *
            Number(
              product?.volume_liter || 0
            );


          return [

            formatDate(
              row.withdrawals?.created_at
            ),

            employee?.name || "",

            product?.name || "",

            quantity,

            liters
              .toFixed(3)
              .replace(".", ",")

          ];

        }
      );


    let csv =
      [
        headers,
        ...rows
      ]
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(value)
                  .replace(/"/g, '""')}"`
            )
            .join(";")
      )
      .join("\n");


    csv =
      "\uFEFF" +
      csv;


    const blob =
      new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      "getraenke-entnahmen.csv";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    URL.revokeObjectURL(
      url
    );

  }

    const totalWithdrawals =

    printWindow.document.write(`

function formatDate(value) {

```
if (!value) {
  return "-";
}


return new Date(
  value
).toLocaleString(
  "de-DE",
  {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }
);
```

}

function formatLiter(value) {

```
return Number(
  value
)
.toLocaleString(
  "de-DE",
  {
    minimumFractionDigits: 0,
    maximumFractionDigits: 3
  }
) +
" l";
```

}

function escapeHtml(text) {

```
const div =
  document.createElement(
    "div"
  );


div.textContent =
  text;


return div.innerHTML;
```

}

```
const element =

element.textContent =

element.style.display =
  "block";

  .getElementById(
    "loading"
  )
  .style.display =
  "none";
```

}
