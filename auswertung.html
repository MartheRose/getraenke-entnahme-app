<script>


const SUPABASE_URL =

  "https://sbiykoqewpotxpliyrsg.supabase.co";


const SUPABASE_KEY =

  "sb_publishable_88GzkUHIG028vaNlh2S1RQ_DZqJb_Y7";


let allRows = [];

let filteredRows = [];



async function supabaseRequest(
  endpoint
) {


  const response =

    await fetch(

      SUPABASE_URL +

      "/rest/v1/" +

      endpoint,

      {

        headers: {

          "apikey":

            SUPABASE_KEY,

          "Authorization":

            "Bearer " +

            SUPABASE_KEY,

          "Content-Type":

            "application/json"

        }

      }

    );


  if (
    !response.ok
  ) {


    const error =

      await response.text();


    throw new Error(
      error
    );


  }


  return await response.json();


}



async function loadData() {


  try {


    const data =

      await supabaseRequest(

        "withdrawal_items" +

        "?select=" +

        "id,quantity,created_at," +

        "withdrawals!inner(" +

          "id,employee_id,created_at," +

          "employees!inner(id,name)," +

          "status" +

        ")," +

        "products!inner(" +

          "id,name,volume_liter,unit" +

        ")" +

        "&order=created_at.desc"

      );


    allRows =

      data || [];


    filteredRows =

      [

        ...allRows

      ];


    populateEmployees();


    renderTable();


  } catch (
    error
  ) {


    console.error(
      error
    );


    showError(

      "Die Entnahmen konnten nicht geladen werden."

    );


  }

}



function populateEmployees() {


  const select =

    document.getElementById(

      "employeeFilter"

    );


  const employeeMap =

    new Map();


  allRows.forEach(

    row => {


      const employee =

        row.withdrawals

          ?.employees;


      if (
        employee
      ) {


        employeeMap.set(

          employee.id,

          employee.name

        );


      }


    }

  );


  employeeMap.forEach(

    (

      name,

      id

    ) => {


      const option =

        document.createElement(

          "option"

        );


      option.value =

        id;


      option.textContent =

        name;


      select.appendChild(

        option

      );


    }

  );


}



function renderTable() {


  const tbody =

    document.getElementById(

      "withdrawalTableBody"

    );


  tbody.innerHTML = "";


  let totalBottles = 0;

  let totalLiters = 0;


  filteredRows.forEach(

    row => {


      const employee =

        row.withdrawals

          ?.employees;


      const product =

        row.products;


      const quantity =

        Number(

          row.quantity

        );


      const volume =

        Number(

          product?.volume_liter ||

          0

        );


      totalBottles +=

        quantity;


      totalLiters +=

        quantity *

        volume;


      const tr =

        document.createElement(

          "tr"

        );


      tr.innerHTML = `


        <td>

          ${formatDate(

            row.withdrawals

              ?.created_at

          )}

        </td>


        <td>

          ${escapeHtml(

            employee?.name ||

            "Unbekannt"

          )}

        </td>


        <td>

          ${escapeHtml(

            product?.name ||

            "Unbekannt"

          )}

        </td>


        <td class="quantity">

          ${quantity}

        </td>


        <td>

          ${formatLiter(

            quantity *

            volume

          )}

        </td>


      `;


      tbody.appendChild(

        tr

      );


    }

  );


  document

    .getElementById(

      "totalWithdrawals"

    )

    .textContent =


      new Set(


        filteredRows.map(


          row =>

            row.withdrawals

              ?.id


        )


      ).size;



  document

    .getElementById(

      "totalBottles"

    )

    .textContent =

      totalBottles;



  document

    .getElementById(

      "totalLiters"

    )

    .textContent =


      formatLiter(

        totalLiters

      );



  document

    .getElementById(

      "loading"

    )

    .style.display =

      "none";



  if (

    filteredRows.length ===

    0

  ) {


    document

      .getElementById(

        "empty"

      )

      .style.display =

        "block";


    document

      .getElementById(

        "withdrawalTable"

      )

      .style.display =

        "none";


  } else {


    document

      .getElementById(

        "empty"

      )

      .style.display =

        "none";


    document

      .getElementById(

        "withdrawalTable"

      ).style.display =

        "table";


  }


}



function applyFilters() {


  const dateFrom =

    document

      .getElementById(

        "dateFrom"

      )

      .value;



  const dateTo =

    document

      .getElementById(

        "dateTo"

      )

      .value;



  const employeeId =

    document

      .getElementById(

        "employeeFilter"

      )

      .value;



  filteredRows =


    allRows.filter(

      row => {


        const date =

          new Date(

            row.withdrawals

              ?.created_at

          );


        const dateString =

          date

            .toLocaleDateString(

              "sv-SE"

            );


        const matchesFrom =

          !dateFrom ||

          dateString >=

          dateFrom;


        const matchesTo =

          !dateTo ||

          dateString <=

          dateTo;


        const matchesEmployee =

          !employeeId ||

          row.withdrawals

            ?.employee_id ===

            employeeId;


        return (

          matchesFrom &&

          matchesTo &&

          matchesEmployee

        );


      }

    );


  renderTable();


}



function resetFilters() {


  document

    .getElementById(

      "dateFrom"

    )

    .value = "";


  document

    .getElementById(

      "dateTo"

    )

    .value = "";


  document

    .getElementById(

      "employeeFilter"

    )

    .value = "";


  filteredRows =

    [

      ...allRows

    ];


  renderTable();


}

  let summaryHTML = "";

  filteredRows.forEach(

        row.withdrawals

          ?.employees;


      const product =

        row.products;


      rowsHTML += `

          <td>

                row.quantity

              Number(
