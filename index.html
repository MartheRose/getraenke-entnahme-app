<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7a1f2b">
  <title>Getränke-Entnahme</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f2;
      color: #2d2926;
      min-height: 100vh;
      user-select: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #7a1f2b;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header-title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-date {
      font-size: clamp(14px, 2vw, 20px);
      text-align: right;
      opacity: 0.95;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 24px 40px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .screen-title {
      text-align: center;
      font-size: clamp(24px, 4vw, 38px);
      margin: 10px 0 30px;
      color: #3a3430;
    }

    .subtitle {
      text-align: center;
      font-size: 20px;
      margin-top: -20px;
      margin-bottom: 30px;
      color: #6b625c;
    }

    /* =========================
       MITARBEITER
    ========================= */

    .employee-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .employee-button {
      min-height: 110px;
      background: white;
      border: 2px solid #ddd6d0;
      border-radius: 18px;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 600;
      color: #3a3430;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      transition: transform 0.1s, background 0.1s;
    }

    .employee-button:active {
      transform: scale(0.97);
      background: #f0e8e4;
    }

    /* =========================
       GETRÄNKE
    ========================= */

    .selected-employee {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #7a1f2b;
      margin-bottom: 25px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: white;
      border: 2px solid #ddd6d0;
      border-radius: 16px;
      min-height: 100px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }

    .product-card.selected {
      border-color: #7a1f2b;
      background: #fbf2f3;
    }

    .product-name {
      font-size: clamp(17px, 2.3vw, 23px);
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
    }

    .product-volume {
      font-size: 15px;
      color: #77706a;
      margin-bottom: 10px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .quantity-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #7a1f2b;
      color: white;
      font-size: 30px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quantity-button:active {
      transform: scale(0.92);
    }

    .quantity {
      min-width: 35px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
    }

    /* =========================
       ZUSAMMENFASSUNG
    ========================= */

    .summary {
      margin-top: 25px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      border: 2px solid #ddd6d0;
    }

    .summary-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 15px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee8e3;
    }

    .summary-total {
      font-size: 20px;
      font-weight: 700;
      color: #7a1f2b;
      display: flex;
      justify-content: space-between;
    }

    .save-button {
      width: 100%;
      margin-top: 20px;
      min-height: 70px;
      background: #7a1f2b;
      color: white;
      border-radius: 14px;
      font-size: 24px;
      font-weight: 700;
    }

    .save-button:disabled {
      background: #bdb5af;
      cursor: not-allowed;
    }

    .save-button:not(:disabled):active {
      transform: scale(0.98);
    }

    /* =========================
       ERFOLG
    ========================= */

    .success-screen {
      text-align: center;
      padding-top: 60px;
    }

    .success-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .success-title {
      font-size: 36px;
      font-weight: 700;
      color: #39734a;
      margin-bottom: 15px;
    }

    .success-text {
      font-size: 22px;
      color: #5f5852;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      padding: 12px;
      color: #938a83;
      font-size: 13px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 700px) {
      .employee-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-card {
        min-height: 145px;
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 14px 16px;
      }

      main {
        padding: 20px 14px 30px;
      }

      .employee-grid {
        gap: 12px;
      }

      .employee-button {
        min-height: 85px;
      }

      .product-grid {
        gap: 10px;
      }

      .product-card {
        min-height: 105px;
        padding: 10px 5px;
      }

      .quantity-button {
        width: 42px;
        height: 42px;
      }

      .quantity-controls {
        gap: 8px;
      }
    }
  </style>

</head>

<body>

<div class="app">

  <header>
    <div class="header-title">GETRÄNKE-ENTNAHME</div>
    <div class="header-date" id="dateTime"></div>
  </header>

  <main>

<!-- =========================
     BILDSCHIRM 1:
     MITARBEITER AUSWÄHLEN
========================== -->

<section id="employeeScreen" class="screen active">

  <h1 class="screen-title">Wer entnimmt Getränke?</h1>

  <div class="employee-grid" id="employeeGrid"></div>

</section>


<!-- =========================
     BILDSCHIRM 2:
     GETRÄNKE AUSWÄHLEN
========================== -->

<section id="productScreen" class="screen">

  <h1 class="screen-title">Getränke auswählen</h1>

  <div class="selected-employee" id="selectedEmployee"></div>

  <div class="product-grid" id="productGrid"></div>

  <div class="summary">

    <div class="summary-title">
      Aktuelle Entnahme
    </div>

    <div class="summary-list" id="summaryList">
      <div style="color:#938a83;">
        Noch keine Getränke ausgewählt.
      </div>
    </div>

    <div class="summary-total">
      <span>Gesamt</span>
      <span id="summaryTotal">0 Flaschen</span>
    </div>

    <button
      class="save-button"
      id="saveButton"
      disabled
      onclick="saveWithdrawal()"
    >
      ✓ ENTNAHME SPEICHERN
    </button>

  </div>

</section>


<!-- =========================
     BILDSCHIRM 3:
     ERFOLG
========================== -->

<section id="successScreen" class="screen">

  <div class="success-screen">

    <div class="success-icon">✓</div>

    <div class="success-title">
      Entnahme gespeichert
    </div>

    <div class="success-text" id="successText"></div>

  </div>

</section>
```

  </main>

  <footer>
    Getränke-Entnahme · Hotel
  </footer>

</div>

<script>

  /* =====================================
     DATEN
  ===================================== */

  const employees = [
    "Marthe",
    "Silke",
    "Nhan",
    "Jonas",
    "Dilshod"
  ];

  const products = [
    {
      id: 1,
      name: "Chardonnay",
      volume: 0.750
    },
    {
      id: 2,
      name: "Grauburgunder",
      volume: 0.750
    },
    {
      id: 3,
      name: "Riesling",
      volume: 0.750
    },
    {
      id: 4,
      name: "Landpartie groß rot",
      volume: 0.750
    },
    {
      id: 5,
      name: "Landpartie groß weiß",
      volume: 0.750
    },
    {
      id: 6,
      name: "Sander Rosé",
      volume: 0.375
    },
    {
      id: 7,
      name: "Sander Rot",
      volume: 0.375
    },
    {
      id: 8,
      name: "Sander Weiß",
      volume: 0.375
    }
  ];


  /* =====================================
     AKTUELLER STATUS
  ===================================== */

  let selectedEmployee = null;

  let quantities = {};


  /* =====================================
     INITIALISIERUNG
  ===================================== */

  function initialize() {

    renderEmployees();

    renderProducts();

    updateDateTime();

    setInterval(updateDateTime, 1000);

  }


  /* =====================================
     DATUM & UHRZEIT
  ===================================== */

  function updateDateTime() {

    const now = new Date();

    const options = {
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    };

    document.getElementById("dateTime").textContent =
      now.toLocaleDateString("de-DE", options);

  }


  /* =====================================
     MITARBEITER ANZEIGEN
  ===================================== */

  function renderEmployees() {

    const grid = document.getElementById("employeeGrid");

    grid.innerHTML = "";

    employees.forEach(employee => {

      const button = document.createElement("button");

      button.className = "employee-button";

      button.textContent = employee;

      button.onclick = function() {

        selectEmployee(employee);

      };

      grid.appendChild(button);

    });

  }


  /* =====================================
     MITARBEITER AUSWÄHLEN
  ===================================== */

  function selectEmployee(employee) {

    selectedEmployee = employee;

    quantities = {};

    products.forEach(product => {

      quantities[product.id] = 0;

    });

    document.getElementById("selectedEmployee").textContent =
      "Entnahme von " + employee;

    updateProductDisplay();

    showScreen("productScreen");

  }


  /* =====================================
     GETRÄNKE ANZEIGEN
  ===================================== */

  function renderProducts() {

    const grid = document.getElementById("productGrid");

    grid.innerHTML = "";

    products.forEach(product => {

      const card = document.createElement("div");

      card.className = "product-card";

      card.id = "product-" + product.id;

      card.innerHTML = `

        <div class="product-name">
          ${product.name}
        </div>

        <div class="product-volume">
          ${formatVolume(product.volume)}
        </div>

        <div class="quantity-controls">

          <button
            class="quantity-button"
            onclick="changeQuantity(${product.id}, -1)"
          >
            −
          </button>

          <div
            class="quantity"
            id="quantity-${product.id}"
          >
            0
          </div>

          <button
            class="quantity-button"
            onclick="changeQuantity(${product.id}, 1)"
          >
            +
          </button>

        </div>

      `;

      grid.appendChild(card);

    });

  }


  /* =====================================
     MENGE ÄNDERN
  ===================================== */

  function changeQuantity(productId, change) {

    let newQuantity =
      quantities[productId] + change;

    if (newQuantity < 0) {

      newQuantity = 0;

    }

    quantities[productId] = newQuantity;

    updateProductDisplay();

  }


  /* =====================================
     PRODUKT-ANZEIGE AKTUALISIEREN
  ===================================== */

  function updateProductDisplay() {

    products.forEach(product => {

      const quantityElement =
        document.getElementById(
          "quantity-" + product.id
        );

      const card =
        document.getElementById(
          "product-" + product.id
        );

      quantityElement.textContent =
        quantities[product.id];

      if (quantities[product.id] > 0) {

        card.classList.add("selected");

      } else {

        card.classList.remove("selected");

      }

    });

    updateSummary();

  }


  /* =====================================
     ZUSAMMENFASSUNG
  ===================================== */

  function updateSummary() {

    const summaryList =
      document.getElementById("summaryList");

    summaryList.innerHTML = "";

    let totalBottles = 0;

    let totalVolume = 0;

    let hasItems = false;


    products.forEach(product => {

      const quantity =
        quantities[product.id];

      if (quantity > 0) {

        hasItems = true;

        totalBottles += quantity;

        totalVolume +=
          quantity * product.volume;


        const item =
          document.createElement("div");

        item.className =
          "summary-item";

        item.innerHTML = `

          <span>
            ${product.name}
          </span>

          <strong>
            ${quantity} Flasche${quantity !== 1 ? "n" : ""}
          </strong>

        `;

        summaryList.appendChild(item);

      }

    });


    if (!hasItems) {

      summaryList.innerHTML = `

        <div style="color:#938a83;">
          Noch keine Getränke ausgewählt.
        </div>

      `;

    }


    document.getElementById("summaryTotal").textContent =

      totalBottles +
      " Flasche" +
      (totalBottles !== 1 ? "n" : "") +
      " · " +
      formatLiter(totalVolume);


    document.getElementById("saveButton").disabled =
      !hasItems;

  }


  /* =====================================
     ENTNAHME SPEICHERN
  ===================================== */

  function saveWithdrawal() {

    let items = [];

    let totalBottles = 0;

    products.forEach(product => {

      const quantity =
        quantities[product.id];

      if (quantity > 0) {

        items.push({

          product: product.name,

          quantity: quantity,

          volume: product.volume

        });

        totalBottles += quantity;

      }

    });


    if (items.length === 0) {

      return;

    }


    const withdrawal = {

      id: crypto.randomUUID(),

      employee: selectedEmployee,

      createdAt: new Date().toISOString(),

      items: items

    };


    /*

      VORLÄUFIG:

      Die Daten werden lokal im Browser gespeichert.

      Im nächsten Schritt verbinden wir diese Funktion

      mit Supabase.

    */


    let withdrawals =
      JSON.parse(
        localStorage.getItem(
          "withdrawals"
        ) || "[]"
      );


    withdrawals.push(withdrawal);


    localStorage.setItem(

      "withdrawals",

      JSON.stringify(withdrawals)

    );


    document.getElementById("successText").textContent =

      selectedEmployee +
      " hat " +
      totalBottles +
      " Flasche" +
      (totalBottles !== 1 ? "n" : "") +
      " entnommen.";


    showScreen("successScreen");


    setTimeout(function() {

      resetApp();

    }, 2000);

  }


  /* =====================================
     APP ZURÜCKSETZEN
  ===================================== */

  function resetApp() {

    selectedEmployee = null;

    quantities = {};

    showScreen("employeeScreen");

  }


  /* =====================================
     BILDSCHIRM WECHSELN
  ===================================== */

  function showScreen(screenId) {

    document
      .querySelectorAll(".screen")
      .forEach(screen => {

        screen.classList.remove("active");

      });


    document
      .getElementById(screenId)
      .classList.add("active");

  }


  /* =====================================
     FORMATE
  ===================================== */

  function formatVolume(volume) {

    return volume
      .toLocaleString("de-DE", {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3
      })
      .replace(/0+$/, "")
      .replace(/,$/, "") +
      " l";

  }


  function formatLiter(volume) {

    return volume
      .toLocaleString("de-DE", {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3
      })
      .replace(/0+$/, "")
      .replace(/,$/, "") +
      " Liter";

  }


  /* =====================================
     APP STARTEN
  ===================================== */

  initialize();

</script>

</body>
</html>
