<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Getränke-Entnahme</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f2;
      color: #2d2926;
      min-height: 100vh;
      user-select: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #7a1f2b;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header-title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 700;
    }

    .header-date {
      font-size: clamp(14px, 2vw, 20px);
      text-align: right;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 24px 40px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .screen-title {
      text-align: center;
      font-size: clamp(24px, 4vw, 38px);
      margin: 10px 0 30px;
      color: #3a3430;
    }

    .employee-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .employee-button {
      min-height: 110px;
      background: white;
      border: 2px solid #ddd6d0;
      border-radius: 18px;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 600;
      color: #3a3430;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    }

    .employee-button:active {
      transform: scale(0.97);
      background: #f0e8e4;
    }

    .selected-employee {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #7a1f2b;
      margin-bottom: 25px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: white;
      border: 2px solid #ddd6d0;
      border-radius: 16px;
      min-height: 120px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }

    .product-card.selected {
      border-color: #7a1f2b;
      background: #fbf2f3;
    }

    .product-name {
      font-size: clamp(17px, 2.3vw, 23px);
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
    }

    .product-volume {
      font-size: 15px;
      color: #77706a;
      margin-bottom: 10px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .quantity-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #7a1f2b;
      color: white;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quantity-button:active {
      transform: scale(0.92);
    }

    .quantity {
      min-width: 35px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
    }

    .summary {
      margin-top: 25px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      border: 2px solid #ddd6d0;
    }

    .summary-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 15px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee8e3;
    }

    .summary-total {
      font-size: 20px;
      font-weight: 700;
      color: #7a1f2b;
      display: flex;
      justify-content: space-between;
    }

    .save-button {
      width: 100%;
      margin-top: 20px;
      min-height: 70px;
      background: #7a1f2b;
      color: white;
      border-radius: 14px;
      font-size: 24px;
      font-weight: 700;
    }

    .save-button:disabled {
      background: #bdb5af;
      cursor: not-allowed;
    }

    .success-screen {
      text-align: center;
      padding-top: 60px;
    }

    .success-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .success-title {
      font-size: 36px;
      font-weight: 700;
      color: #39734a;
      margin-bottom: 15px;
    }

    .success-text {
      font-size: 22px;
      color: #5f5852;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      text-align: center;
      display: none;
    }

    .loading {
      text-align: center;
      font-size: 20px;
      color: #77706a;
      padding: 40px;
    }

    footer {
      text-align: center;
      padding: 12px;
      color: #938a83;
      font-size: 13px;
    }

    @media (min-width: 700px) {

      .employee-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-card {
        min-height: 145px;
      }

    }

    @media (max-width: 500px) {

      header {
        padding: 14px 16px;
      }

      main {
        padding: 20px 14px 30px;
      }

      .employee-grid {
        gap: 12px;
      }

      .employee-button {
        min-height: 85px;
      }

      .product-grid {
        gap: 10px;
      }

      .product-card {
        min-height: 105px;
        padding: 10px 5px;
      }

      .quantity-button {
        width: 42px;
        height: 42px;
      }

      .quantity-controls {
        gap: 8px;
      }

    }

  </style>

</head>

<body>

<div class="app">

  </header>

  <main>

  <h1 class="screen-title">

  <div id="employeeError" class="error-message"></div>

  <div id="employeeLoading" class="loading">

  <div class="employee-grid" id="employeeGrid"></div>

<section id="productScreen" class="screen">

  <h1 class="screen-title">

  </h1>

  <div class="selected-employee" id="selectedEmployee"></div>

  <div id="productError" class="error-message"></div>

  <div class="product-grid" id="productGrid"></div>


  <div class="summary">

    <div class="summary-title">
      Aktuelle Entnahme
    </div>

    <div class="summary-list" id="summaryList">

    <button

</section>

  </main>

  <footer>

  </footer>

</div>

<script>

  /* ==========================================
     SUPABASE KONFIGURATION
  ========================================== */

  const SUPABASE_URL =
    "https://sbiykoqewpotxpliyrsg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_88GzkUHIG028vaNlh2S1RQ_DZqJb_Y7";


  /* ==========================================
     DATEN
  ========================================== */

  let employees = [];

  let products = [];

  let selectedEmployee = null;

  let quantities = {};


  /* ==========================================
     SUPABASE REQUEST
  ========================================== */

  async function supabaseRequest(
    table,
    options = {}
  ) {

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table;


    const headers = {

      "apikey":
        SUPABASE_KEY,

      "Authorization":
        "Bearer " +
        SUPABASE_KEY,

      "Content-Type":
        "application/json",

      "Accept":
        "application/json"

    };


    if (options.returnRepresentation) {

      headers["Prefer"] =
        "return=representation";

    }


    const response =
      await fetch(
        url,
        {

          method:
            options.method ||
            "GET",

          headers:

            headers,

          body:

            options.body
              ? JSON.stringify(
                  options.body
                )
              : undefined

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Supabase Fehler"
      );

    }


    const text =
      await response.text();


    if (!text) {

      return null;

    }


    return JSON.parse(text);

  }


  /* ==========================================
     APP START
  ========================================== */

  async function initialize() {

    updateDateTime();

    setInterval(
      updateDateTime,
      1000
    );


    try {

      await loadEmployees();

      await loadProducts();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  /* ==========================================
     MITARBEITER LADEN
  ========================================== */

  async function loadEmployees() {

    try {

      const data =
        await supabaseRequest(
          "employees?select=id,name&active=eq.true&order=name"
        );


      employees =
        data || [];


      document
        .getElementById(
          "employeeLoading"
        )
        .style.display =
          "none";


      renderEmployees();

    } catch (error) {

      showError(
        "employeeError",
        "Mitarbeiter konnten nicht geladen werden."
      );

      console.error(
        error
      );

    }

  }


  /* ==========================================
     GETRÄNKE LADEN
  ========================================== */

  async function loadProducts() {

    try {

      const data =
        await supabaseRequest(
          "products?select=id,name,volume_liter,unit&active=eq.true&order=sort_order"
        );


      products =
        data || [];


      renderProducts();

    } catch (error) {

      showError(
        "employeeError",
        "Getränke konnten nicht geladen werden."
      );

      console.error(
        error
      );

    }

  }


  /* ==========================================
     MITARBEITER ANZEIGEN
  ========================================== */

  function renderEmployees() {

    const grid =
      document.getElementById(
        "employeeGrid"
      );


    grid.innerHTML = "";


    employees.forEach(
      employee => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "employee-button";


        button.textContent =
          employee.name;


        button.onclick =
          function() {

            selectEmployee(
              employee
            );

          };


        grid.appendChild(
          button
        );

      }
    );

  }


  /* ==========================================
     MITARBEITER AUSWÄHLEN
  ========================================== */

  function selectEmployee(
    employee
  ) {

    selectedEmployee =
      employee;


    quantities = {};


    products.forEach(
      product => {

        quantities[
          product.id
        ] = 0;

      }
    );


    document
      .getElementById(
        "selectedEmployee"
      )
      .textContent =

        "Entnahme von " +
        employee.name;


    updateProductDisplay();


    showScreen(
      "productScreen"
    );

  }


  /* ==========================================
     GETRÄNKE ANZEIGEN
  ========================================== */

  function renderProducts() {

    const grid =
      document.getElementById(
        "productGrid"
      );


    grid.innerHTML = "";


    products.forEach(
      product => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "product-card";


        card.id =
          "product-" +
          product.id;


        card.innerHTML = `

          <div class="product-name">

            ${escapeHtml(
              product.name
            )}

          </div>

          <div class="product-volume">

            ${formatVolume(
              product.volume_liter
            )}

          </div>

          <div class="quantity-controls">

            <button

              class="quantity-button"

              onclick="
                changeQuantity(
                  '${product.id}',
                  -1
                )
              "

            >
              −
            </button>


            <div

              class="quantity"

              id="quantity-${product.id}"

            >
              0
            </div>


            <button

              class="quantity-button"

              onclick="
                changeQuantity(
                  '${product.id}',
                  1
                )
              "

            >
              +
            </button>

          </div>

        `;


        grid.appendChild(
          card
        );

      }
    );

  }


  /* ==========================================
     MENGE ÄNDERN
  ========================================== */

  function changeQuantity(
    productId,
    change
  ) {

    let newQuantity =

      quantities[
        productId
      ] + change;


    if (
      newQuantity < 0
    ) {

      newQuantity = 0;

    }


    quantities[
      productId
    ] = newQuantity;


    updateProductDisplay();

  }


  /* ==========================================
     ANZEIGE AKTUALISIEREN
  ========================================== */

  function updateProductDisplay() {

    products.forEach(
      product => {

        const quantityElement =

          document.getElementById(
            "quantity-" +
            product.id
          );


        const card =

          document.getElementById(
            "product-" +
            product.id
          );


        quantityElement.textContent =

          quantities[
            product.id
          ];


        if (
          quantities[
            product.id
          ] > 0
        ) {

          card.classList.add(
            "selected"
          );

        } else {

          card.classList.remove(
            "selected"
          );

        }

      }
    );


    updateSummary();

  }


  /* ==========================================
     ZUSAMMENFASSUNG
  ========================================== */

  function updateSummary() {

    const summaryList =

      document.getElementById(
        "summaryList"
      );


    summaryList.innerHTML = "";


    let totalBottles = 0;

    let totalVolume = 0;

    let hasItems = false;


    products.forEach(
      product => {

        const quantity =

          quantities[
            product.id
          ] || 0;


        if (
          quantity > 0
        ) {

          hasItems = true;


          totalBottles +=
            quantity;


          totalVolume +=

            quantity *
            Number(
              product.volume_liter
            );


          const item =

            document.createElement(
              "div"
            );


          item.className =
            "summary-item";


          item.innerHTML = `

            <span>

              ${escapeHtml(
                product.name
              )}

            </span>

            <strong>

              ${quantity} ×

            </strong>

          `;


          summaryList.appendChild(
            item
          );

        }

      }
    );


    if (
      !hasItems
    ) {

      summaryList.innerHTML = `

        <div style="color:#938a83;">

          Noch keine Getränke ausgewählt.

        </div>

      `;

    }


    document
      .getElementById(
        "summaryTotal"
      )
      .textContent =

        totalBottles +
        " Flasche" +
        (
          totalBottles !== 1
            ? "n"
            : ""
        ) +
        " · " +
        formatLiter(
          totalVolume
        );


    document
      .getElementById(
        "saveButton"
      )
      .disabled =
        !hasItems;

  }


  /* ==========================================
     ENTNAHME SPEICHERN
  ========================================== */

  async function saveWithdrawal() {

    if (
      !selectedEmployee
    ) {

      return;

    }


    const items =

      products

        .filter(
          product =>

            quantities[
              product.id
            ] > 0

        )

        .map(
          product => ({

            product_id:
              product.id,

            quantity:
              quantities[
                product.id
              ]

          })
        );


    if (
      items.length === 0
    ) {

      return;

    }


    const saveButton =

      document.getElementById(
        "saveButton"
      );


    saveButton.disabled =
      true;


    saveButton.textContent =
      "WIRD GESPEICHERT...";


    try {


      /* --------------------------------------
         1. WITHDRAWAL ERSTELLEN
      -------------------------------------- */

      const withdrawalData =

        await supabaseRequest(

          "withdrawals",

          {

            method:
              "POST",

            body: {

              employee_id:
                selectedEmployee.id,

              status:
                "completed"

            },

            returnRepresentation:
              true

          }

        );


      if (
        !withdrawalData ||
        !withdrawalData[0]
      ) {

        throw new Error(
          "Entnahme konnte nicht erstellt werden."
        );

      }


      const withdrawalId =

        withdrawalData[0].id;


      /* --------------------------------------
         2. POSITIONEN ERSTELLEN
      -------------------------------------- */

      const itemRows =

        items.map(
          item => ({

            withdrawal_id:
              withdrawalId,

            product_id:
              item.product_id,

            quantity:
              item.quantity

          })
        );


      await supabaseRequest(

        "withdrawal_items",

        {

          method:
            "POST",

          body:
            itemRows

        }

      );


      /* --------------------------------------
         3. ERFOLG ANZEIGEN
      -------------------------------------- */

      const totalBottles =

        items.reduce(

          (
            sum,
            item
          ) =>

            sum +
            item.quantity,

          0

        );


      document
        .getElementById(
          "successText"
        )
        .textContent =

          selectedEmployee.name +
          " hat " +
          totalBottles +
          " Flasche" +
          (
            totalBottles !== 1
              ? "n"
              : ""
          ) +
          " entnommen.";


      showScreen(
        "successScreen"
      );


      setTimeout(
        resetApp,
        2000
      );


    } catch (error) {

      console.error(
        "Speicherfehler:",
        error
      );


      showError(

        "productError",

        "Die Entnahme konnte nicht gespeichert werden. Bitte erneut versuchen."

      );


      saveButton.disabled =
        false;


      saveButton.textContent =

        "✓ ENTNAHME SPEICHERN";

    }

  }


  /* ==========================================
     APP ZURÜCKSETZEN
  ========================================== */

  function resetApp() {

    selectedEmployee =
      null;


    quantities = {};


    showScreen(
      "employeeScreen"
    );

  }


  /* ==========================================
     SCREEN WECHSELN
  ========================================== */

  function showScreen(
    screenId
  ) {

    document
      .querySelectorAll(
        ".screen"
      )
      .forEach(
        screen => {

          screen.classList.remove(
            "active"
          );

        }
      );


    document
      .getElementById(
        screenId
      )
      .classList.add(
        "active"
      );

  }


  /* ==========================================
     FEHLER ANZEIGEN
  ========================================== */

  function showError(
    elementId,
    message
  ) {

    const element =

      document.getElementById(
        elementId
      );


    element.textContent =
      message;


    element.style.display =
      "block";


    setTimeout(
      function() {

        element.style.display =
          "none";

      },
      6000
    );

  }


  /* ==========================================
     DATUM & UHRZEIT
  ========================================== */

  function updateDateTime() {

    const now =
      new Date();


    const options = {

      weekday:
        "long",

      day:
        "2-digit",

      month:
        "2-digit",

      year:
        "numeric",

      hour:
        "2-digit",

      minute:
        "2-digit"

    };


    document
      .getElementById(
        "dateTime"
      )
      .textContent =

        now.toLocaleDateString(
          "de-DE",
          options
        );

  }


  /* ==========================================
     FORMATIERUNG
  ========================================== */

  function formatVolume(
    volume
  ) {

    const number =
      Number(volume);


    return number
      .toLocaleString(
        "de-DE",
        {

          minimumFractionDigits:
            0,

          maximumFractionDigits:
            3

        }
      ) +
      " l";

  }


  function formatLiter(
    volume
  ) {

    return Number(volume)
      .toLocaleString(
        "de-DE",
        {

          minimumFractionDigits:
            0,

          maximumFractionDigits:
            3

        }
      ) +
      " Liter";

  }


  /* ==========================================
     SICHERHEIT
  ========================================== */

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }


  /* ==========================================
     START
  ========================================== */

  initialize();

</script>
